name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: pip install -q -r backend/requirements.txt
      - name: 静态检查（ruff）
        run: cd backend && python -m ruff check app tests
      - name: 测试 + 覆盖率（pytest + cov）
        run: cd backend && python -m pytest tests -q --cov=app --cov-report=term

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 安装依赖
        run: cd frontend && npm install --no-audit --no-fund
      - name: 构建
        run: cd frontend && npm run build
